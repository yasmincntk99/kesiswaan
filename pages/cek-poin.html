<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cek Poin Siswa | SMAN 1 Sooko Mojokerto</title>
    <meta name="description" content="Cek poin pelanggaran dan riwayat kedisiplinan siswa SMAN 1 Sooko dengan NIS.">
    <meta name="theme-color" content="#0F4C81">

    <!-- ANTI-FLASH THEME INIT -->
    <script>
        (function () {
            try {
                var saved = localStorage.getItem('kesiswaan-theme');
                var theme = saved || ((window.matchMedia &&
                    window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', theme);
            } catch (e) {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>

    <link rel="icon" href="../assets/icons/icon.png">
    <link rel="apple-touch-icon" href="../assets/icons/icon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/theme.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="../css/glass.css">
    <link rel="stylesheet" href="../css/animation.css">
    <link rel="stylesheet" href="../css/shell.css">
    <link rel="stylesheet" href="../css/stats-panel.css">
    <link rel="stylesheet" href="../css/kesiswaan.css">
</head>

<body data-page="cek-poin">

    <div class="bg-layer" aria-hidden="true"></div>

    <div id="shellNav"></div>

    <header class="header">
        <div class="container">
            <img src="../assets/logo/logo.png" alt="Logo SMAN 1 Sooko" class="logo">
            <span class="kd-eyebrow">Gerakan Disiplin Sekolah · Transparansi</span>
            <h1>Cek <span>Poin Siswa</span></h1>
            <p>Masukkan NIS untuk melihat poin dan riwayat pelanggaran.</p>
        </div>
    </header>

    <main class="kd-wrap">

        <section class="kd-card kd-search-card" aria-labelledby="cpTitle">
            <h2 class="kd-card-title" id="cpTitle">Cek Poin Pelanggaran</h2>
            <p class="kd-card-sub">Poin dihitung kumulatif sejak 1 Juli (awal tahun ajaran).</p>
            <form id="cpForm" novalidate>
                <label class="kd-sr" for="keyword">NIS</label>
                <input class="kd-input" id="keyword" name="keyword" type="text" inputmode="numeric"
                       placeholder="Masukkan NIS" autocomplete="off" required>
                <button type="submit" class="kd-btn kd-btn--primary" id="cpBtn">Cari →</button>
            </form>
        </section>

        <div id="cpResult" aria-live="polite"></div>

    </main>

    <div id="shellFooter"></div>

    <script src="../js/config.js"></script>
    <script src="../js/theme.js"></script>
    <script src="../js/ui-kit.js"></script>
    <script src="../js/shell.js"></script>
    <script src="../js/cek-poin.js"></script>
</body>

</html>
