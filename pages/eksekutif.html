<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Portal Eksekutif – KPI Disiplin | SMAN 1 Sooko Mojokerto</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#0F4C81">

    <!-- Penjaga halaman: tanpa sesi admin valid, halaman tertutup overlay login -->
    <script src="../js/admin-auth.js" data-require-role="eksekutif"></script>

    <!-- ANTI-FLASH THEME INIT -->
    <script>
        (function () {
            try {
                var saved = localStorage.getItem('kesiswaan-theme');
                var theme = saved || ((window.matchMedia &&
                    window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', theme);
            } catch (e) {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>

    <link rel="icon" href="../assets/icons/icon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/theme.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="../css/glass.css">
    <link rel="stylesheet" href="../css/animation.css">
    <link rel="stylesheet" href="../css/shell.css">
    <link rel="stylesheet" href="../css/stats-panel.css">
    <link rel="stylesheet" href="../css/kesiswaan.css">
</head>

<body data-page="eksekutif">

    <div class="bg-layer" aria-hidden="true"></div>

    <div id="shellNav"></div>

    <header class="header">
        <div class="container">
            <img src="../assets/logo/logo.png" alt="Logo SMAN 1 Sooko" class="logo">
            <span class="kd-eyebrow">Gerakan Disiplin Sekolah · Portal Eksekutif</span>
            <h1>KPI <span>Disiplin Sekolah</span></h1>
            <p>Ringkasan capaian kedisiplinan untuk pimpinan. Hanya angka agregat, tanpa nama siswa.</p>
        </div>
    </header>

    <main class="kd-wrap" id="eksMain">

        <div class="kd-eks-bar">
            <span class="kd-chip kd-chip--live" id="eksTa">Memuat…</span>
            <span class="kd-chip" id="eksTgl"></span>
            <div class="kd-eks-actions">
                <button type="button" class="kd-btn kd-btn--sm" id="eksReload">Segarkan</button>
                <button type="button" class="kd-btn kd-btn--sm" id="eksPrint">Cetak A4</button>
                <button type="button" class="kd-btn kd-btn--sm kd-btn--primary" id="eksTayang">▶ Mode tayang</button>
            </div>
        </div>

        <div id="eksAlert" aria-live="polite"></div>
        <section class="kd-card kd-tanya" data-tanya aria-label="Tanya Data"></section>

        <div id="eksBody"><p class="kd-card-sub">Memuat data…</p></div>

    </main>

    <div class="kd-tayang kd-hidden" id="eksStage" role="dialog" aria-label="Mode tayang KPI">
        <div class="kd-tayang-bg" aria-hidden="true"></div>
        <header class="kd-tayang-head">
            <img src="../assets/logo/logo.png" alt="" class="kd-tayang-logo">
            <div class="kd-tayang-brand"><small>SMAN 1 Sooko Mojokerto</small><strong>Gerakan Disiplin Sekolah</strong></div>
            <span class="kd-tayang-ta" id="eksStageTa"></span>
            <button type="button" class="kd-tayang-x" id="eksStageX" aria-label="Tutup mode tayang">✕</button>
        </header>
        <div class="kd-tayang-slide" id="eksSlide"></div>
        <footer class="kd-tayang-nav">
            <button type="button" class="kd-btn kd-btn--sm" id="eksPrev" aria-label="Sebelumnya">◀</button>
            <span id="eksDots" class="kd-tayang-dots"></span>
            <span id="eksCount" class="kd-tayang-count"></span>
            <button type="button" class="kd-btn kd-btn--sm" id="eksNext" aria-label="Berikutnya">▶</button>
        </footer>
        <div class="kd-tayang-prog"><i id="eksProg"></i></div>
    </div>

    <div id="shellFooter"></div>

    <script src="../js/config.js"></script>
    <script src="../js/theme.js"></script>
    <script src="../js/ui-kit.js"></script>
    <script src="../js/shell.js"></script>
    <script src="../js/eksekutif.js"></script>
    <script src="../js/tanya.js"></script>

</body>

</html>
